version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: geomeasure_db
    restart: always
    environment:
      POSTGRES_USER: geomeasure_user
      POSTGRES_PASSWORD: geomeasure_password
      POSTGRES_DB: geomeasure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomeasure_user -d geomeasure_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: geomeasure_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://geomeasure_user:geomeasure_password@db:5432/geomeasure_db
      PROJECT_NAME: "GeoMeasure Pro API"
      API_V1_STR: "/api"
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geomeasure_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
